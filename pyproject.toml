[project]
name = "customer-segmentation"
version = "0.1.0"
description = "Customer segmentation via PCA + KMeans on demographic and purchase data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_segmentation"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
# Installed by default: tests plus the chart script.
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.10.9",
]
# Jupyter + plotting for the analysis notebooks:  uv sync --group notebooks
notebooks = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "notebook>=7.5.6",
    "seaborn>=0.13.2",
]
# Deep-learning side project in audiobooks/:  uv sync --group audiobooks
audiobooks = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "notebook>=7.5.6",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
]
